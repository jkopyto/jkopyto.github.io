# Cennik – treść podstrony /cennik
#
# Sekcje wyświetlają się w kolejności z tego pliku. Wszystkie pola sekcji są opcjonalne:
#   title     – nagłówek sekcji
#   id        – kotwica do linkowania (np. "#pakiety")
#   highlight – true = nazwy usług jako fioletowe nagłówki
#   intro     – tekst nad listą usług (markdown, **pogrubienie**)
#   items     – lista usług:
#       name     – nazwa (wymagana)
#       duration – czas w minutach, dopisywane jest " min" (opcjonalne)
#       price    – cena, dopisywane jest " zł" (wymagana)
#       details  – linia opisu pod nazwą (opcjonalne)
#       list     – punkty pod nazwą (opcjonalne); numbered: true = lista numerowana
#       addons   – dodatkowe pozycje z ceną, wyświetlane jako "> nazwa   cena"
#   table     – tabela: columns = nagłówki, rows = wiersze (1. kolumna to nazwa, reszta to ceny w zł)
#   info      – ramka z informacjami pod sekcją (markdown, akapity oddzielone pustą linią)
#   footnote  – wyróżniona uwaga na końcu sekcji
#   link      – link pod sekcją: text + url
#
# Pole item.link (np. /uslugi/diagnoza) zamienia nazwę usługi w link do jej podstrony,
# a najniższa cena z takich pozycji trafia do "Cena: od … zł" na tej podstronie (_includes/service-cta.html).

