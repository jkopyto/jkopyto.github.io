  - title: Pakiet miesięczny
    id: pakiety
    table:
      columns: [Rodzaj zajęć, Cena pakietu, Cena za 1 zajęcia w pakiecie, Cena bez pakietu]
      rows:
        - [Zajęcia Fusion, 700, 175, 200]
        - [Trening funkcji poznawczych, 600, 150, 160]
        - [TUS/TZA, 480, 120, 130]
    info: |
      **Ważne informacje!**

      Pakiet obejmuje zajęcia prowadzone w cyklu **12 spotkań**. Jeden pakiet odpowiada jednemu miesiącowi pracy i obejmuje udział we wszystkich zaplanowanych spotkaniach w ramach cyklu.

      Płatność za pakiet jest dokonywana z góry, przed rozpoczęciem zajęć.

      Warunkiem skorzystania z pakietu jest podpisanie kontraktu oraz deklaracji udziału w całym cyklu 12 spotkań.

      Zasady odrabiania nieobecności oraz warunki ewentualnego odpracowania zajęć są ustalane podczas podpisywania kontraktu i określane w jego warunkach.

